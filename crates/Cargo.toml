[workspace]
resolver = "2"
members = ["zecret-core", "zecret-node", "zecret-wasm"]
# A standalone crate with its own workspace (used by zecret-wasm as a path dependency).
exclude = ["zecret-intents"]

[workspace.package]
edition = "2024"
publish = false
license = "MIT"

# Proving and scanning are slow without optimisation, also in tests.
[profile.dev]
opt-level = 3

[profile.release]
opt-level = 3
