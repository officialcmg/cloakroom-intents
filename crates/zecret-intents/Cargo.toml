[package]
name = "zecret-intents"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Exit from NEAR Intents: 1Click quotes, a pre-signing check of the generated intent, ed25519 signing (raw_ed25519 and nep413) and direct Verifier payloads. No I/O; builds natively and for wasm32-unknown-unknown."

[dependencies]
base64 = "0.22"
bs58 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["alloc", "std"] }
ed25519-dalek = "2"
getrandom = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"

# The browser has no OS random source. getrandom 0.3 also needs the cfg in
# .cargo/config.toml.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
near-workspaces = "0.24"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Keep test builds small on disk.
[profile.dev]
debug = false
incremental = false

[profile.test]
debug = false
incremental = false

# A standalone crate, not a member of the crates/ workspace.
[workspace]
