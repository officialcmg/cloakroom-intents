[package]
name = "zecret-wasm"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The Zecret taker engine for a browser Web Worker: zecret-core's taker and the exit through NEAR Intents (zecret-intents) behind wasm-bindgen, over synchronous XMLHttpRequest."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zecret-core = { path = "../zecret-core" }
zecret-intents = { path = "../zecret-intents" }
anyhow = "1"
hex = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["alloc", "std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["XmlHttpRequest", "XmlHttpRequestResponseType", "console"] }
# zecret-intents uses getrandom 0.3; its browser backend needs the feature here as well
# as the cfg in crates/.cargo/config.toml.
getrandom = { version = "0.3", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
zecret-node = { path = "../zecret-node" }
# examples/mainnet_exit.rs: GET and POST for 1Click (the same version and features as zecret-node).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "rustls-tls-native-roots"] }
