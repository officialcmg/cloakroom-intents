[package]
name = "near-escrow"
version = "0.1.0"
edition = "2021"
description = "NEAR escrow for one leg of a shielded ZEC to NEP-141 token swap"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
pasta_curves = { version = "0.6.1", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
# Test-only: the client derives G from reddsa's Orchard SpendAuth basepoint.
reddsa = "0.6.1"
near-workspaces = "0.24"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
ed25519-dalek = "2"
bs58 = "0.5"
base64 = "0.22"
chrono = "0.4"
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# A standalone crate, not a member of any parent workspace.
[workspace]
