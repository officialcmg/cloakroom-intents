[package]
name = "zecret-testnet-exit"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
zecret-core = { path = "../../crates/zecret-core" }
zecret-node = { path = "../../crates/zecret-node" }
zecret-intents = { path = "../../crates/zecret-intents" }
anyhow = "1"
hex = "0.4"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["alloc", "std", "clock"] }

zcash_primitives = { version = "=0.31.0-pre.1", default-features = false, features = ["std", "circuits"] }
zcash_protocol = { version = "=0.11.0-pre.0", features = ["local-consensus"] }

[workspace]

[[bin]]
name = "zecret-testnet-exit"
path = "src/main.rs"

[[bin]]
name = "zecret-testnet-audit"
path = "src/audit.rs"

[[bin]]
name = "zecret-testnet-addkey"
path = "src/addkey.rs"
