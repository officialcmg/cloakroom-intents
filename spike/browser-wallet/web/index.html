<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser wallet spike</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; max-width: 900px; background: #fff; color: #111; }
  code, pre { font: 12px/1.4 ui-monospace, monospace; word-break: break-all; white-space: pre-wrap; }
  input { width: 100%; box-sizing: border-box; margin: 2px 0 8px; }
  pre#log { background: #f4f4f4; padding: 8px; max-height: 50vh; overflow: auto; }
</style>
</head>
<body>
<h1>Browser wallet spike</h1>
<p>The Zcash light wallet runs as WebAssembly in a Web Worker. Local regtest only.</p>
<button id="go">Create wallet and scan</button> <button id="refresh">Scan again</button>
<p>Address: <code id="addr">-</code></p>
<p>Balance: <code id="bal">-</code></p>
<p>Received notes and memos:</p><pre id="memo">-</pre>
<h2>Send</h2>
<label>To (unified address) <input id="to"></label>
<label>Zatoshis <input id="z" value="50000"></label>
<label>Memo (up to 512 bytes) <input id="m" value="hello"></label>
<button id="send">Build, prove and send</button>
<h2>Log</h2>
<pre id="log"></pre>
<script type="module" src="page.js"></script>
</body>
</html>
