<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Cloakroom Intents: swap shielded ZEC for a token on another chain, in your browser, with no custodian." />
    <meta property="og:title" content="Cloakroom Intents" />
    <meta property="og:description" content="Swap shielded ZEC for a token on another chain, in your browser, with no custodian. Testnet." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cloakroom.chrismg.dev/" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1015" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cloakroom Intents: swap shielded ZEC</title>
    <!-- The hash of this script is allowed in the Content-Security-Policy of vercel.json; change both together (tests/unit/csp.test.ts checks it). -->
    <script>
      // Apply a saved theme before the first paint, so the page does not flash.
      try {
        var t = localStorage.getItem('zecret.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Cloakroom Intents runs the swap in your browser and needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
